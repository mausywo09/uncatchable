server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # The page changes on every update (CA, links): always revalidate
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    # The launch API (server/api.mjs) runs in the same container on 127.0.0.1:8787. It sets its own Cache-Control.
    location ^~ /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Content-Type-Options; # the API sets it; avoid a duplicate header
        proxy_read_timeout 30s;
    }
    # Images rarely change: cache for a day
    location ~* \.(png|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }
}
